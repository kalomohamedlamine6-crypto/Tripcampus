<!doctype html>
<html lang="fr">
    <head>
        <title>TripCampus</title>
        <meta charset="utf-8">
        <meta
            name="description"
            content="TripCampus accompagne les élèves, étudiants et familles dans l’orientation et le choix des études supérieures en Côte d’Ivoire.">
        <meta
            name="keywords"
            content="TripCampus, orientation, enseignement supérieur, Côte d’Ivoire, filières, formations, établissements">
        <meta
            name="viewport"
            content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0">

        <base href="/">
 
        <link
            rel="icon"
            type="image/svg+xml"
            href="assets/images/logo/tripcampus-icon.svg">

        <!-- Fonts -->
        <link
            href="assets/fonts/inter/inter.css"
            rel="stylesheet">

        <link
            href="https://fonts.gstatic.com"
            rel="preconnect">
        <link
            href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap"
            rel="stylesheet">

        <!-- Icon fonts -->
        <link
            href="https://fonts.googleapis.com/icon?family=Material+Icons"
            rel="stylesheet">

        <!-- Splash screen styles -->
        <link
            href="assets/styles/splash-screen.css"
            rel="stylesheet">

    </head>

    <body>

        <!-- Splash screen -->
        <fuse-splash-screen>
            <img
                src="assets/images/logo/tripcampus.svg"
                alt="TripCampus">
            <div class="spinner">
                <div class="bounce1"></div>
                <div class="bounce2"></div>
                <div class="bounce3"></div>
            </div>
        </fuse-splash-screen>

        <!-- App root -->
        <app-root></app-root>

    </body>

</html>
