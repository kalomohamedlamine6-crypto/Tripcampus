<!-- Loading bar -->
<fuse-loading-bar></fuse-loading-bar>

<!-- Wrapper -->
<div class="flex flex-col flex-auto w-full min-w-0">

    <!-- Header -->
    <div class=" relative flex flex-0 items-center w-full h-16 sm:h-20 px-4 md:px-6 z-49 shadow dark:shadow-none dark:border-b bg-card dark:bg-transparent print:hidden">
        
        <!-- Logo -->
        <div class="flex items-center mx-2 lg:mr-8">
            <div class="hidden lg:flex">
                <div class="flex items-end w-full space-x-3 mt-2 sm:mt-0 sm:ml-auto">
                    <div class="flex items-center justify-center w-8 h-8 rounded-full bg-[#1a237e]">
                        <mat-icon svgIcon="heroicons_outline:academic-cap" class="icon-size-8 relative bottom-0" style="color: white"></mat-icon>
                    </div>
                    <span class="text-[#1a237e] scale-y-150 sm:text-3xl md:text-3xl font-extrabold tracking-tight leading-tight">
                        <p>TripCampus</p>
                    </span>
                </div>
            </div>
            <img class="flex lg:hidden w-8" src="assets/images/logo/logo.svg">
        </div>

        <!-- Modules -->
        <nav class="hidden md:flex items-center justify-center flex-1 mx-6 space-x-1">
            <a *ngFor="let module of modules"
               [routerLink]="module.route"
               class="px-4 py-2 rounded-full text-lg font-semibold transition-colors duration-200"
               [ngClass]="isActiveModule(module.route) ? 'bg-[#1a237e] text-white shadow' : 'text-[#1a237e] hover:bg-blue-50'">
                {{ module.label }}
            </a>
        </nav>

        <!-- Components -->
        <!-- <div class="flex items-center pl-2 ml-auto space-x-0.5 sm:space-x-2">
            <ng-container *ngIf="!isHomeRoute">
                <button mat-flat-button color="primary" class="fuse-mat-button-large w-sm ml-4" (click)="goToSignUp()">
                    <span>Inscription</span>
                </button>
                <button mat-flat-button class="fuse-mat-button-large w-sm ml-4 bg-gray-800 text-white" (click)="goToSignIn()">
                    <span>Connexion</span>
                </button>
            </ng-container>
        </div> -->
    </div>

    <!-- Content -->
    <div class="flex flex-col flex-auto w-full">
        <router-outlet *ngIf="true"></router-outlet>
    </div>

    <!-- Footer -->
    <div class="relative flex flex-0 items-center w-full h-14 sm:h-20 px-4 md:px-6 z-49 border-t bg-card dark:bg-transparent print:hidden">
        <span class="font-fdmedium text-[#1a237e]">TripCampus &copy; {{currentYear}}</span>
    </div>
</div>
