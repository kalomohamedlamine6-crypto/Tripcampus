<!-- Loading bar -->
<fuse-loading-bar></fuse-loading-bar>

<!-- Navigation -->
<ng-container *ngIf="isScreenSmall">
    <fuse-vertical-navigation class="mohamed bg-gray-200 text-[#1a237e] print:hidden" [mode]="'over'"
        [name]="'mainNavigation'" [navigation]="navigation.default" [opened]="false">
        <!-- Navigation header hook -->
        <ng-container fuseVerticalNavigationContentHeader>
            <!-- Logo -->
            <div class="flex items-center h-20 pt-6 px-8">
                <img class="w-24" src="assets/images/logo/logo-text-on-dark.svg" alt="Logo image">
            </div>
        </ng-container>
    </fuse-vertical-navigation>
</ng-container>

<!-- Wrapper -->
<div class="flex flex-col flex-auto w-full min-w-0">

    <!-- Header -->
    <div
        class="relative flex flex-0 items-center w-full h-16 sm:h-20 px-4 md:px-6 z-49 shadow dark:shadow-none dark:border-b bg-card dark:bg-transparent print:hidden">
        <ng-container *ngIf="!isScreenSmall">
            <!-- Logo -->
            <div class="flex items-center mx-2 lg:mr-8">
                <div class="hidden lg:flex">
                    <div class="flex  items-end w-full space-x-3 mt-2 sm:mt-0 sm:ml-auto">
                        <div class="flex items-center justify-center w-8 h-8 rounded-full bg-[#1a237e]">
                            <mat-icon svgIcon="heroicons_outline:academic-cap" class="icon-size-8  relative bottom-0"
                                style="color: white"></mat-icon>
                        </div>

                        <span
                            class="text-[#1a237e] scale-y-150 sm:text-3xl md:text-3xl font-extrabold tracking-tight leading-tight text-center">
                            <p>TripCampus</p>
                        </span>
                    </div>
                </div>
                <img class="flex lg:hidden w-8" src="assets/images/logo/logo.svg">
            </div>
            <!-- Horizontal navigation -->
            <fuse-horizontal-navigation class="mr-2 modern-horizontal-navigation" [name]="'mainNavigation'"
                [navigation]="navigation.horizontal"></fuse-horizontal-navigation>
        </ng-container>
        <!-- Navigation toggle button -->
        <ng-container *ngIf="isScreenSmall">
            <button mat-icon-button (click)="toggleNavigation('mainNavigation')">
                <mat-icon [svgIcon]="'heroicons_outline:menu'"></mat-icon>
            </button>
        </ng-container>

        <mat-form-field
            class="mt-0 p-0 ml-4 fuse-mat-no-subscript fuse-mat-rounded border-primary fuse-mat-bold w-120 max-w-xl sm:max-w-120 ">
            <input matInput [placeholder]="'Enter a question, topic or keyword'">
            <mat-icon matPrefix [svgIcon]="'heroicons_outline:search'"></mat-icon>
        </mat-form-field>

        <button class="fuse-mat-button-large w-sm ml-4" mat-flat-button [color]="'primary'" (click)="goToSignUp()">
            <span>
                Inscription
            </span>
            
        </button>
        <button class="fuse-mat-button-large w-sm ml-4 bg-gray-800 text-white" mat-flat-button (click)="goToSignIn()">
            <span>
               Connexion
            </span>
            
        </button>
        <!-- Components -->
        <div class="flex items-center pl-2 ml-auto space-x-0.5 sm:space-x-2">
            <languages></languages>

            
            <button class="lg:hidden" mat-icon-button (click)="quickChat.toggle()">
                <mat-icon [svgIcon]="'heroicons_outline:chat-alt-2'"></mat-icon>
            </button>
            
        </div>
    </div>

    <!-- Content -->
    <div class="flex flex-col flex-auto w-full">
        <!-- *ngIf="true" hack is required here for router-outlet to work correctly.
             Otherwise, layout changes won't be registered and the view won't be updated! -->
        <router-outlet *ngIf="true"></router-outlet>
    </div>

    <!-- Footer -->
    <div
        class="relative flex flex-0 items-center w-full h-14 sm:h-20 px-4 md:px-6 z-49 border-t bg-card dark:bg-transparent print:hidden">
        <span class="font-medium text-[#1a237e]">TripCampus &copy; {{currentYear}}</span>
    </div>

</div>

<!-- Quick chat -->
<quick-chat #quickChat="quickChat"></quick-chat>
