<fuse-loading-bar></fuse-loading-bar>

<div class="flex h-screen min-h-0 w-full min-w-0 flex-auto flex-col overflow-hidden">
    <header class="sticky top-0 z-[100] h-16 w-full flex-none border-b border-gray-200 bg-white shadow-sm print:hidden sm:h-20">
        <div class="relative mx-auto flex h-full max-w-7xl items-center justify-between gap-3 px-3 sm:px-6">
            <a routerLink="/home" class="flex shrink-0 items-center rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-300"
                aria-label="TripCampus, accueil">
                <img src="assets/images/logo/tripcampus.svg" alt="TripCampus" class="h-9 w-auto sm:h-10">
            </a>

            <nav class="hidden flex-1 items-center justify-center gap-1 md:flex"
                aria-label="Navigation principale">
                <a *ngFor="let module of modules; trackBy: trackByRoute"
                    [routerLink]="module.route"
                    [attr.aria-current]="isActiveModule(module.route) ? 'page' : null"
                    class="rounded-full px-3 py-2 text-sm font-semibold transition-colors lg:px-4 lg:text-base"
                    [ngClass]="isActiveModule(module.route) ? 'bg-[#1a237e] text-white shadow' : 'text-[#1a237e] hover:bg-indigo-50'">
                    {{ module.label }}
                </a>
            </nav>

            <button type="button" class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl text-[#1a237e] hover:bg-indigo-50 focus:outline-none focus:ring-2 focus:ring-indigo-300 md:hidden"
                (click)="toggleMobileMenu()"
                [attr.aria-expanded]="mobileMenuOpen"
                aria-controls="mobile-primary-navigation"
                [attr.aria-label]="mobileMenuOpen ? 'Fermer le menu' : 'Ouvrir le menu'">
                <mat-icon>{{ mobileMenuOpen ? 'close' : 'menu' }}</mat-icon>
            </button>

            <nav *ngIf="mobileMenuOpen" id="mobile-primary-navigation"
                class="absolute inset-x-0 top-full border-b border-gray-200 bg-white p-3 shadow-lg md:hidden"
                aria-label="Navigation principale">
                <a *ngFor="let module of modules; trackBy: trackByRoute"
                    [routerLink]="module.route"
                    (click)="closeMobileMenu()"
                    [attr.aria-current]="isActiveModule(module.route) ? 'page' : null"
                    class="mb-1 block rounded-xl px-4 py-3 text-base font-semibold last:mb-0"
                    [ngClass]="isActiveModule(module.route) ? 'bg-[#1a237e] text-white' : 'text-[#1a237e] hover:bg-indigo-50'">
                    {{ module.label }}
                </a>
            </nav>
        </div>
    </header>

    <main class="flex min-h-0 w-full flex-auto flex-col overflow-x-hidden overflow-y-auto">
        <router-outlet></router-outlet>
    </main>

    <footer class="relative z-10 flex h-14 w-full flex-none items-center border-t border-gray-200 bg-white px-4 sm:h-16 sm:px-6 print:hidden">
        <span class="text-sm font-medium text-[#1a237e]">TripCampus &copy; {{ currentYear }}</span>
    </footer>
</div>
