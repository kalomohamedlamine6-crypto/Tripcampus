<div class="p-8 bg-white rounded-2xl shadow-sm">
    <h2 class="text-2xl font-bold text-[#1a237e] mb-4">Comparateur d’établissements</h2>
 
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 mb-8">
        <div *ngFor="let etab of etablissementsCriteres"
            class="border border-gray-200 rounded-xl p-4 hover:shadow-md transition">
            <div class="flex items-center justify-between mb-3">
                <h3 class="font-semibold text-lg">{{ etab.name }}</h3>
                <button
                    type="button"
                    class="px-3 py-1 rounded-full text-sm font-medium"
                    [ngClass]="etablissementsCriteres.includes(etab) ? 'bg-[#1a237e] text-white' : 'bg-gray-100 text-gray-700'"
                    (click)="toggleSelection(etab)"
                >
                    {{ etablissementsCriteres.includes(etab) ? 'Retirer' : 'Sélectionner' }}
                </button>
            </div>

            <p class="text-sm text-gray-600 mb-1">{{ etab.category }}</p>
            <p class="text-sm text-gray-600 mb-1">{{ etab.ville }}</p>
            <p class="text-sm text-gray-600 mb-1">{{ etab.type }}</p>
            <p class="text-sm text-gray-600">{{ etab.description }}</p>
        </div>
    </div>

    <div *ngIf="selectedForComparison.length > 0" class="border-t pt-6"> 
        
 
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
            <div
                *ngFor="let etab of selectedForComparison"
                class="border border-[#1a237e]/20 rounded-xl p-4 bg-indigo-50"
            >
                <h4 class="font-semibold text-lg mb-2">{{ etablissements.name }}</h4>
                <p class="text-sm text-gray-700"><strong>Statut :</strong> {{ etab.statut }}</p>
                <p class="text-sm text-gray-700"><strong>Note :</strong> {{ etab.note }}</p>
                <p class="text-sm text-gray-700"><strong>Insertion :</strong> {{ etab.insertPro || 'À venir' }}</p>
                <p class="text-sm text-gray-700"><strong>Prix :</strong> {{ etab.prixMoy || 'À venir' }}</p>
            </div>
        </div>
    </div>
</div>
