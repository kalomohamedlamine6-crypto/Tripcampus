<div class="flex items-center justify-between p-4 border-b bg-gray-50">
    <h2 class="text-xl font-bold text-[#1a237e] m-0">❔ Quiz d'Or<span class="text-gray-500">ientation</span></h2>
    <button mat-icon-button (click)="close()">
        <mat-icon [svgIcon]="'heroicons_outline:x'"></mat-icon>
    </button>
</div>

<mat-dialog-content class="p-6 max-h-[640px]">
    <form [formGroup]="horizontalStepperForm">
        <mat-horizontal-stepper [linear]="true" #horizontalStepper>
            
            <mat-step [formGroupName]="'step1'" [stepControl]="horizontalStepperForm.get('step1')" #horizontalStepperStep1>
                <ng-template matStepLabel>Informations</ng-template>
                <p class="my-4 font-medium text-secondary">Remplissez vos informations de base.</p>
                
                <div class="flex flex-col gap-2">
                    <mat-form-field class="w-full">
                        <mat-label>Adresse Email</mat-label>
                        <input matInput formControlName="email" placeholder="Email Address" required>
                        <mat-icon matPrefix class="icon-size-5 mr-2" [svgIcon]="'heroicons_solid:mail'"></mat-icon>
                    </mat-form-field>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <mat-form-field class="w-full">
                            <mat-label>Pays</mat-label>
                            <mat-select formControlName="country" required>
                                <mat-option value="country-1">Country 1</mat-option>
                                <mat-option value="country-2">Country 2</mat-option>
                            </mat-select>
                            <mat-icon matPrefix class="icon-size-5 mr-2" [svgIcon]="'heroicons_solid:location-marker'"></mat-icon>
                        </mat-form-field>

                        <mat-form-field class="w-full">
                            <mat-label>Langue</mat-label>
                            <mat-select formControlName="language" required>
                                <mat-option value="language-1">Language 1</mat-option>
                                <mat-option value="language-2">Language 2</mat-option>
                            </mat-select>
                            <mat-icon matPrefix class="icon-size-5 mr-2" [svgIcon]="'heroicons_solid:translate'"></mat-icon>
                        </mat-form-field>
                    </div>
                </div>

                <div class="flex justify-end mt-6">
                    <button mat-flat-button color="primary" [disabled]="horizontalStepperStep1.stepControl.invalid" type="button" matStepperNext>Suivant</button>
                </div>
            </mat-step>

            <mat-step [formGroupName]="'step2'" [stepControl]="horizontalStepperForm.get('step2')" #horizontalStepperStep2>
                <ng-template matStepLabel>Profil</ng-template>
                <p class="my-4 font-medium text-secondary">Parlez-nous de vous.</p>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-2">
                    <mat-form-field class="w-full">
                        <input matInput formControlName="firstName" placeholder="Prénom" required>
                    </mat-form-field>
                    <mat-form-field class="w-full">
                        <input matInput formControlName="lastName" placeholder="Nom" required>
                    </mat-form-field>
                </div>

                <div class="flex justify-end mt-6 gap-2">
                    <button mat-flat-button color="accent" type="button" matStepperPrevious>Retour</button>
                    <button mat-flat-button color="primary" [disabled]="horizontalStepperStep2.stepControl.invalid" type="button" matStepperNext>Suivant</button>
                </div>
            </mat-step>

            <mat-step [formGroupName]="'step3'">
                <ng-template matStepLabel>Fin</ng-template>
                <p class="my-4 font-medium">Merci d'avoir rempli le questionnaire !</p>
                
                <div class="flex justify-end mt-6 gap-2">
                    <button mat-flat-button color="accent" type="button" matStepperPrevious>Retour</button>
                    <button mat-flat-button class="bg-green-600 text-white" type="button" (click)="close()">Terminer</button>
                </div>
            </mat-step>

        </mat-horizontal-stepper>
    </form>
</mat-dialog-content>
